[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "rcwa-cross-validation"
version = "0.2.0"
description = "Reproducible optical benchmarks for rigorous coupled-wave analysis solvers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "PyYAML==6.0.3", "matplotlib==3.10.8", "grcwa==0.1.2", "meent==0.13.2", "threadpoolctl==3.8.0"]

[project.optional-dependencies]
cuda = ["torch==2.8.0", "torcwa==0.1.4.2"]
notebook = ["jupyterlab>=4.4,<5", "ipykernel>=6.30,<8"]
dev = ["pytest>=9,<10", "nbclient>=0.10,<1"]

[project.scripts]
rcwa-cv = "rcwa_cv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
